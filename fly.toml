# Fly.io deployment. First-time setup and secrets: see "Deploying to Fly.io" in README.md.
app = "accessai-server-gemini"
primary_region = "lhr" # London: lowest latency to Nigeria (Fly has no West Africa region)

[build]

[env]
  APP_ENV = "production"
  LLM_PROVIDER = "gemini"
  PORT = "8000"
  # SQLite lives on the persistent volume so sessions/confirmations survive restarts and deploys
  DATABASE_PATH = "/data/voice_intent.db"
  # Published in the JWKS; change it whenever ED25519_PRIVATE_KEY_B64 is rotated
  JWKS_KID = "accessai-fly-1"
  # Secrets (set with `flyctl secrets set`, never committed):
  #   GEMINI_API_KEY, ED25519_PRIVATE_KEY_B64

[mounts]
  source = "accessai_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # SQLite on a volume = exactly one machine; keep it always on (deploy with --ha=false)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
