name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded test runs are cancelled, but never a run on main (it may be deploying)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: detect
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No pyproject.toml or requirements.txt yet; nothing to build."; fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Ruff
        if: steps.detect.outputs.present == 'true'
        run: ruff check --output-format=github .

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        run: pytest -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

  deploy:
    name: Deploy to Fly.io
    needs: test
    # Only merges/pushes to main in the upstream repo; never PRs, branches or forks
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Accessibility-AI/accessai-server-gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://accessai-server-gemini.fly.dev/docs
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://accessai-server-gemini.fly.dev
    steps:
      - name: Check deploy token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN secret is not set; skipping deploy. See README 'Continuous deployment'."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
        with:
          version: 0.4.106

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --ha=false --wait-timeout 5m

      - name: Smoke check
        if: steps.token.outputs.present == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$APP_URL/health" | grep -q '"healthy"'; then break; fi
            echo "waiting for /health ($i)"; sleep 5
          done
          curl -fsS "$APP_URL/health"; echo
          curl -fsS "$APP_URL/.well-known/jwks.json" | grep -q '"EdDSA"'
          echo "Deployed ${GITHUB_SHA::7} to $APP_URL"
